name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'Laboratorios/Lab_02/**'

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Laboratorios/Lab_02

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify files
        run: |
          pwd
          ls -la
          test -f pom.xml

      - name: Run Tests
        run: mvn -B test
